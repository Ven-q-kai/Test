name: Build GraphLab APK

on:
  push:
    branches: [chatgpt-graph-apk-v1.0.2]
    paths:
      - 'GraphLab/**'
      - '.github/workflows/build-graphlab-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GraphLab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GraphLab-1.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GraphLab-1.0.2-APK
          path: GraphLab/GraphLab-1.0.2.apk
          if-no-files-found: error
